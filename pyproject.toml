[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rep-counter"
version = "1.0.0"
description = "Count reps and coach exercise form from video using pose estimation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amit Dubey" }]
keywords = ["computer-vision", "pose-estimation", "mediapipe", "fitness", "opencv"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
vision = ["mediapipe>=0.10.14", "opencv-python>=4.8"]
app = ["streamlit>=1.46", "pandas>=2.0", "imageio-ffmpeg>=0.4"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
repcounter = "repcounter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
